{% extends 'main/base.html' %}
{% block content %}
    <h2>Удаление заявки</h2>
<p>Вы действительно хотите удалить заявку <strong>"{{ app.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'profile' %}" class="btn">Отмена</a>
    </form>
{% endblock %}
