{% extends 'main/base.html' %}
{% block content %}
    <h2>Смена статуса для "{{ app.title }}"</h2>
    <form method="post" enctype="multipart/form-data" class="box" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить статус</button>
        <a href="{% url 'admin_panel' %}" class="btn btn-danger">Отмена</a>
    </form>
{% endblock %}
